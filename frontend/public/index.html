<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8A2BE2" />
    
    <!-- Primary Meta Tags -->
    <title>SafeHer | Women's Safety Platform</title>
    <meta name="title" content="SafeHer | Women's Safety Platform" />
    <meta
      name="description"
      content="SafeHer is a community-driven safety platform for women. Report incidents, view unsafe areas on a map, and access emergency support."
    />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://safeher-app-umber.vercel.app/" />
    <meta property="og:title" content="SafeHer | Women's Safety Platform" />
    <meta
      property="og:description"
      content="Report incidents, view unsafe areas on a map, and access emergency support."
    />
    <meta property="og:image" content="%PUBLIC_URL%/favicon.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://safeher-app-umber.vercel.app/" />
    <meta property="twitter:title" content="SafeHer | Women's Safety Platform" />
    <meta
      property="twitter:description"
      content="Report incidents, view unsafe areas on a map, and access emergency support."
    />
    <meta property="twitter:image" content="%PUBLIC_URL%/favicon.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/shield.svg" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    
    <!-- Apple Touch Icon (For iPhones) -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
